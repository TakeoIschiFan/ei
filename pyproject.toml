[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ei-media"
version = "0.1.2"
description = "Minimal media server with optional transcoding"
readme = "README.md"
requires-python = ">= 3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "takeoischifan", email = "takeoischifan@github.com" }]
keywords = ["media-server", "video", "streaming", "lan", "dash"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/TakeoIschiFan/ei"
Repository = "https://github.com/TakeoIschiFan/ei"
Issues = "https://github.com/TakeoIschiFan/ei/issues"
Releases = "https://github.com/TakeoIschiFan/ei/releases"

[project.scripts]
ei = "ei.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ei"]

[dependency-groups]
dev = ["pyinstaller>=6.22.2", "pytest>=8", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Vendored browser deps, grab using scripts/vendor_sync.py
[tool.ei.vendor]
media-chrome = "4.19.2"
dash-video-element = "0.3.2"
custom-media-element = "1.4.6"
dashjs = "5.1.1"
media-tracks = "0.3.5"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# integration helpers use a compact lambda for repeated polling.
"tests/test_integration.py" = ["E731"]

[tool.ruff.format]
quote-style = "double"
